<!DOCTYPE html>
<html lang="da" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forside | Kino</title>

    <!-- Skrifter: Fraunces til overskrifter, Albert Sans til tekst -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&display=swap" rel="stylesheet">

    <!-- Bootstrap (gitter, knapper, formularer) og Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Kinos eget udseende. Skal stå efter Bootstrap, så det vinder -->
    <link href="css/kino.css" rel="stylesheet">
</head>
<!-- data-root fortæller JavaScript, hvor projektets rod ligger set fra denne side -->
<body data-root="">

<!-- Menu og sidefod sættes ind af js/ui.js (mountLayout) -->
<main>
    <section class="kino-hero" id="hero" hidden>
        <div class="container kino-hero-inner">
            <div id="heroText"></div>
            <div id="heroPoster"></div>
        </div>
    </section>

    <div class="container">
        <section class="kino-section" aria-labelledby="todayTitle">
            <div class="kino-section-head">
                <h2 id="todayTitle">I dag</h2>
                <a href="program.html">Se hele programmet</a>
            </div>
            <div id="today"></div>
        </section>

        <section class="kino-section" aria-labelledby="premiereTitle">
            <div class="kino-section-head">
                <h2 id="premiereTitle">Premierefilm</h2>
            </div>
            <div id="premieres"></div>
        </section>

        <section class="kino-section" aria-labelledby="searchTitle">
            <div class="kino-section-head">
                <h2 id="searchTitle">Find en film</h2>
            </div>
            <div class="kino-search mb-4">
                <label class="visually-hidden" for="searchInput">Søg på titel</label>
                <input class="form-control" type="search" id="searchInput" placeholder="Søg på titel" autocomplete="off">
                <div class="kino-chips" id="genreChips" role="group" aria-label="Genre"></div>
            </div>
            <div id="searchResults"></div>
        </section>
    </div>
</main>

<!-- Bootstraps JavaScript (bruges til beskeder og dialoger) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- type="module" gør, at filen kan bruge import/export -->
<script type="module" src="js/pages/index.js"></script>
</body>
</html>

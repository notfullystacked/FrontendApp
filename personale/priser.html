<!DOCTYPE html>
<html lang="da" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Priser | Kino</title>

    <!-- Skrifter: Fraunces til overskrifter, Albert Sans til tekst -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&display=swap" rel="stylesheet">

    <!-- Bootstrap (gitter, knapper, formularer) og Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Kinos eget udseende. Skal stå efter Bootstrap, så det vinder -->
    <link href="../css/kino.css" rel="stylesheet">
</head>
<!-- data-root fortæller JavaScript, hvor projektets rod ligger set fra denne side -->
<body data-root="../">

<!-- Menu og sidefod sættes ind af js/ui.js (mountLayout) -->
<main>
    <div class="container py-5" style="max-width: 820px">
        <h1>Billetpriser</h1>
        <p class="lead mb-4">Priserne gælder for alle forestillinger. En ændring slår igennem med det samme.</p>
        <div id="list" class="mb-5"></div>

        <form class="kino-panel" id="newForm" novalidate>
            <h2 class="h4">Ny billettype</h2>
            <div class="row g-3 align-items-end">
                <div class="col-6">
                    <label class="form-label" for="newName">Navn</label>
                    <input class="form-control" id="newName" type="text" required placeholder="Studerende">
                    <div class="invalid-feedback">Skriv et navn.</div>
                </div>
                <div class="col-3">
                    <label class="form-label" for="newPrice">Pris i kr.</label>
                    <input class="form-control" id="newPrice" type="number" min="0" required>
                    <div class="invalid-feedback">Skriv en pris.</div>
                </div>
                <div class="col-3">
                    <button class="btn btn-primary w-100" type="submit">Opret</button>
                </div>
            </div>
        </form>
    </div>
</main>

<!-- Bootstraps JavaScript (bruges til beskeder og dialoger) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- type="module" gør, at filen kan bruge import/export -->
<script type="module" src="../js/pages/personale-priser.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="da" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Billetkontrol | Kino</title>

    <!-- Skrifter: Fraunces til overskrifter, Albert Sans til tekst -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&display=swap" rel="stylesheet">

    <!-- Bootstrap (gitter, knapper, formularer) og Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Kinos eget udseende. Skal stå efter Bootstrap, så det vinder -->
    <link href="../css/kino.css" rel="stylesheet">
</head>
<!-- data-root fortæller JavaScript, hvor projektets rod ligger set fra denne side -->
<body data-root="../">

<!-- Menu og sidefod sættes ind af js/ui.js (mountLayout) -->
<main>
    <div class="container py-5" style="max-width: 760px">
        <h1>Billetkontrol</h1>
        <p class="lead mb-4">Skriv booking-nummeret fra billetten. Det står under QR-koden, fx 12 eller TICKET-12.</p>

        <form class="kino-panel mb-4 d-flex gap-3 align-items-end" id="lookupForm" novalidate>
            <div class="flex-grow-1">
                <label class="form-label" for="bookingNumber">Booking-nummer</label>
                <input class="form-control form-control-lg" id="bookingNumber" type="text" inputmode="numeric" required autocomplete="off">
                <div class="invalid-feedback">Skriv et booking-nummer.</div>
            </div>
            <button class="btn btn-primary btn-lg" type="submit">Find billet</button>
        </form>

        <div id="result"></div>
    </div>
</main>

<!-- Bootstraps JavaScript (bruges til beskeder og dialoger) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- type="module" gør, at filen kan bruge import/export -->
<script type="module" src="../js/pages/personale-billetkontrol.js"></script>
</body>
</html>

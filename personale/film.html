<!DOCTYPE html>
<html lang="da" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Film | Kino</title>

    <!-- Skrifter: Fraunces til overskrifter, Albert Sans til tekst -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&display=swap" rel="stylesheet">

    <!-- Bootstrap (gitter, knapper, formularer) og Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Kinos eget udseende. Skal stå efter Bootstrap, så det vinder -->
    <link href="../css/kino.css" rel="stylesheet">
</head>
<!-- data-root fortæller JavaScript, hvor projektets rod ligger set fra denne side -->
<body data-root="../">

<!-- Menu og sidefod sættes ind af js/ui.js (mountLayout) -->
<main>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Film</h1>
            <button class="btn btn-primary" type="button" id="newBtn"><i class="bi bi-plus-lg" aria-hidden="true"></i> Opret film</button>
        </div>
        <div id="list"></div>
    </div>

    <!-- Formular til opret og ret. Vises som dialog -->
    <div class="modal fade" id="movieModal" tabindex="-1" aria-labelledby="movieModalTitle">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <form class="modal-content" id="movieForm" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title h4" id="movieModalTitle">Opret film</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Luk"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-8">
                            <label class="form-label" for="name">Titel</label>
                            <input class="form-control" id="name" type="text" required>
                            <div class="invalid-feedback">Filmen skal have en titel.</div>
                        </div>
                        <div class="col-4">
                            <label class="form-label" for="genre">Genre</label>
                            <select class="form-select" id="genre"></select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="description">Beskrivelse</label>
                            <textarea class="form-control" id="description" rows="3" maxlength="2000"></textarea>
                        </div>
                        <div class="col-3">
                            <label class="form-label" for="runTime">Spilletid (minutter)</label>
                            <input class="form-control" id="runTime" type="number" min="1" required>
                            <div class="invalid-feedback">Skriv spilletiden i minutter.</div>
                        </div>
                        <div class="col-3">
                            <label class="form-label" for="ageRestriction">Aldersgrænse</label>
                            <input class="form-control" id="ageRestriction" type="number" min="0" max="18">
                            <div class="invalid-feedback">Mellem 0 og 18.</div>
                        </div>
                        <div class="col-3">
                            <label class="form-label" for="imdbRating">IMDb-rating</label>
                            <input class="form-control" id="imdbRating" type="number" min="0" max="10" step="0.1">
                            <div class="invalid-feedback">Mellem 0 og 10.</div>
                        </div>
                        <div class="col-3">
                            <label class="form-label" for="releaseYear">Udgivelsesår</label>
                            <input class="form-control" id="releaseYear" type="number" min="1890" max="2100">
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="director">Instruktør</label>
                            <input class="form-control" id="director" type="text">
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="premiereDate">Premiere i Kino</label>
                            <input class="form-control" id="premiereDate" type="date">
                            <div class="form-text">En dato i fremtiden giver mærkatet Kommer snart.</div>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="posterUrl">Link til plakat</label>
                            <input class="form-control" id="posterUrl" type="url" placeholder="https://...">
                            <div class="invalid-feedback">Linket skal starte med http:// eller https://.</div>
                            <div class="form-text">Uden et link tegner siden selv en plakat med titlen.</div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Fortryd</button>
                    <button type="submit" class="btn btn-primary">Gem film</button>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- Bootstraps JavaScript (bruges til beskeder og dialoger) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- type="module" gør, at filen kan bruge import/export -->
<script type="module" src="../js/pages/personale-film.js"></script>
</body>
</html>

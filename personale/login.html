<!DOCTYPE html>
<html lang="da" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personale-login | Kino</title>

    <!-- Skrifter: Fraunces til overskrifter, Albert Sans til tekst -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&display=swap" rel="stylesheet">

    <!-- Bootstrap (gitter, knapper, formularer) og Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Kinos eget udseende. Skal stå efter Bootstrap, så det vinder -->
    <link href="../css/kino.css" rel="stylesheet">
</head>
<!-- data-root fortæller JavaScript, hvor projektets rod ligger set fra denne side -->
<body data-root="../">

<!-- Menu og sidefod sættes ind af js/ui.js (mountLayout) -->
<main>
    <div class="container py-5" style="max-width: 520px">
        <h1>Personale</h1>
        <p class="lead mb-4">Log ind med dit brugernavn for at komme til personalesiderne.</p>
        <form class="kino-panel" id="loginForm" novalidate>
            <div class="mb-3">
                <label class="form-label" for="username">Brugernavn</label>
                <input class="form-control" id="username" type="text" required autocomplete="username">
                <div class="invalid-feedback">Skriv dit brugernavn.</div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Adgangskode</label>
                <input class="form-control" id="password" type="password" required autocomplete="current-password">
                <div class="invalid-feedback">Skriv din adgangskode.</div>
            </div>
            <button class="btn btn-primary" type="submit">Log ind</button>
        </form>
    </div>
</main>

<!-- Bootstraps JavaScript (bruges til beskeder og dialoger) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- type="module" gør, at filen kan bruge import/export -->
<script type="module" src="../js/pages/personale-login.js"></script>
</body>
</html>

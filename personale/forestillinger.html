<!DOCTYPE html>
<html lang="da" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forestillinger | Kino</title>

    <!-- Skrifter: Fraunces til overskrifter, Albert Sans til tekst -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&display=swap" rel="stylesheet">

    <!-- Bootstrap (gitter, knapper, formularer) og Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Kinos eget udseende. Skal stå efter Bootstrap, så det vinder -->
    <link href="../css/kino.css" rel="stylesheet">
</head>
<!-- data-root fortæller JavaScript, hvor projektets rod ligger set fra denne side -->
<body data-root="../">

<!-- Menu og sidefod sættes ind af js/ui.js (mountLayout) -->
<main>
    <div class="container py-5">
        <h1>Forestillinger</h1>
        <p class="lead mb-4">Planlæg en forestilling højst tre måneder frem. Systemet afviser to forestillinger, der overlapper i samme sal.</p>

        <form class="kino-panel mb-5" id="showingForm" novalidate>
            <h2 class="h4">Planlæg forestilling</h2>
            <div class="row g-3 align-items-end">
                <div class="col-4">
                    <label class="form-label" for="movie">Film</label>
                    <select class="form-select" id="movie" required></select>
                    <div class="invalid-feedback">Vælg en film.</div>
                </div>
                <div class="col-3">
                    <label class="form-label" for="auditorium">Sal</label>
                    <select class="form-select" id="auditorium" required></select>
                    <div class="invalid-feedback">Vælg en sal.</div>
                </div>
                <div class="col-3">
                    <label class="form-label" for="startTime">Dato og tid</label>
                    <input class="form-control" id="startTime" type="datetime-local" required>
                    <div class="invalid-feedback">Vælg dato og tid.</div>
                </div>
                <div class="col-2">
                    <button class="btn btn-primary w-100" type="submit">Planlæg</button>
                </div>
            </div>
        </form>

        <h2 class="h4">Kommende forestillinger</h2>
        <div id="list"></div>
    </div>
</main>

<!-- Bootstraps JavaScript (bruges til beskeder og dialoger) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- type="module" gør, at filen kan bruge import/export -->
<script type="module" src="../js/pages/personale-forestillinger.js"></script>
</body>
</html>

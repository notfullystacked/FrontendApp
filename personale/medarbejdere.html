<!DOCTYPE html>
<html lang="da" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Medarbejdere | Kino</title>

    <!-- Skrifter: Fraunces til overskrifter, Albert Sans til tekst -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&display=swap" rel="stylesheet">

    <!-- Bootstrap (gitter, knapper, formularer) og Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Kinos eget udseende. Skal stå efter Bootstrap, så det vinder -->
    <link href="../css/kino.css" rel="stylesheet">
</head>
<!-- data-root fortæller JavaScript, hvor projektets rod ligger set fra denne side -->
<body data-root="../">

<!-- Menu og sidefod sættes ind af js/ui.js (mountLayout) -->
<main>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Medarbejdere</h1>
            <button class="btn btn-primary" type="button" id="newBtn"><i class="bi bi-plus-lg" aria-hidden="true"></i> Opret medarbejder</button>
        </div>
        <div id="list"></div>
    </div>

    <div class="modal fade" id="employeeModal" tabindex="-1" aria-labelledby="employeeModalTitle">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="employeeForm" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title h4" id="employeeModalTitle">Opret medarbejder</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Luk"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="name">Navn</label>
                        <input class="form-control" id="name" type="text" required>
                        <div class="invalid-feedback">Skriv et navn.</div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label" for="username">Brugernavn</label>
                            <input class="form-control" id="username" type="text" required autocomplete="off">
                            <div class="invalid-feedback">Skriv et brugernavn.</div>
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="phoneNr">Telefon</label>
                            <input class="form-control" id="phoneNr" type="tel">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" id="email" type="email" required>
                        <div class="invalid-feedback">Skriv en gyldig email.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Adgangskode</label>
                        <input class="form-control" id="password" type="password" minlength="6" autocomplete="new-password">
                        <div class="invalid-feedback">Mindst 6 tegn.</div>
                        <div class="form-text" id="passwordHelp"></div>
                    </div>
                    <fieldset>
                        <legend class="form-label fs-6">Roller</legend>
                        <div id="roles" class="d-flex flex-wrap gap-3"></div>
                    </fieldset>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Fortryd</button>
                    <button type="submit" class="btn btn-primary">Gem medarbejder</button>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- Bootstraps JavaScript (bruges til beskeder og dialoger) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- type="module" gør, at filen kan bruge import/export -->
<script type="module" src="../js/pages/personale-medarbejdere.js"></script>
</body>
</html>

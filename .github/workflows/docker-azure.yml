# Bygger frontendens Docker-image (nginx + HTML/CSS/JS), sender det til Azure Container Registry (ACR)
# og opdaterer frontendens Azure Web App, så den kører det nye image.
#
# Kræver disse secrets i GitHub på FrontendApp (Settings -> Secrets and variables -> Actions):
#   ACR_LOGIN_SERVER   samme som i BackendApp, fx kinoregistry.azurecr.io
#   ACR_USERNAME       samme som i BackendApp
#   ACR_PASSWORD       samme som i BackendApp
#   AZURE_WEBAPP_NAME  navnet på frontendens Web App (fx kino-frontend-nfs)
#   AZURE_WEBAPP_PUBLISH_PROFILE  publish profile fra frontendens Web App

name: Docker image til Azure

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: kino-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log ind i ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Byg og push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy til Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

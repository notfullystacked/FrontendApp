<!DOCTYPE html>
<html lang="da" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log ind | Kino</title>

    <!-- Skrifter: Fraunces til overskrifter, Albert Sans til tekst -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&display=swap" rel="stylesheet">

    <!-- Bootstrap (gitter, knapper, formularer) og Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Kinos eget udseende. Skal stå efter Bootstrap, så det vinder -->
    <link href="css/kino.css" rel="stylesheet">
</head>
<!-- data-root fortæller JavaScript, hvor projektets rod ligger set fra denne side -->
<body data-root="">

<!-- Menu og sidefod sættes ind af js/ui.js (mountLayout) -->
<main>
    <div class="container py-5">
        <h1>Din konto</h1>
        <p class="lead mb-5">Med en konto kan du se alle dine bookinger samlet. Du kan også bestille billetter uden.</p>
        <div class="row g-4">
            <div class="col-6">
                <form class="kino-panel" id="loginForm" novalidate>
                    <h2>Log ind</h2>
                    <div class="mb-3">
                        <label class="form-label" for="loginEmail">Email</label>
                        <input class="form-control" id="loginEmail" type="email" required autocomplete="email">
                        <div class="invalid-feedback">Skriv din email.</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="loginPassword">Adgangskode</label>
                        <input class="form-control" id="loginPassword" type="password" required autocomplete="current-password">
                        <div class="invalid-feedback">Skriv din adgangskode.</div>
                    </div>
                    <button class="btn btn-primary" type="submit">Log ind</button>
                </form>
            </div>
            <div class="col-6">
                <form class="kino-panel" id="registerForm" novalidate>
                    <h2>Opret konto</h2>
                    <div class="mb-3">
                        <label class="form-label" for="regName">Navn</label>
                        <input class="form-control" id="regName" type="text" required autocomplete="name">
                        <div class="invalid-feedback">Skriv dit navn.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="regEmail">Email</label>
                        <input class="form-control" id="regEmail" type="email" required autocomplete="email">
                        <div class="invalid-feedback">Skriv en gyldig email.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="regBirthday">Fødselsdag</label>
                        <input class="form-control" id="regBirthday" type="date" autocomplete="bday">
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="regPassword">Adgangskode</label>
                        <input class="form-control" id="regPassword" type="password" required minlength="6" autocomplete="new-password">
                        <div class="invalid-feedback">Adgangskoden skal være på mindst 6 tegn.</div>
                    </div>
                    <button class="btn btn-gold" type="submit">Opret konto</button>
                </form>
            </div>
        </div>
    </div>
</main>

<!-- Bootstraps JavaScript (bruges til beskeder og dialoger) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- type="module" gør, at filen kan bruge import/export -->
<script type="module" src="js/pages/konto.js"></script>
</body>
</html>

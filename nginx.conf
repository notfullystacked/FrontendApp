# nginx serverer frontendens filer og sender alle kald til /api videre til backenden.
# Så kommer siden og API'et fra samme adresse set fra browseren, og CORS er ikke nødvendigt i Docker.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # host.docker.internal er din egen computer set inde fra containeren (Docker Desktop)
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
    }
}

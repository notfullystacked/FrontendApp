# nginx serverer frontendens filer og sender alle kald til /api videre til backenden.
# Så kommer siden og API'et fra samme adresse set fra browseren. Derfor er CORS ikke nødvendigt,
# og login-cookien bliver sendt med.
#
# Filen er en skabelon: når containeren starter, erstatter nginx ${BACKEND_URL} med miljøvariablen.
#   Lokalt i Docker (standard, se Dockerfile):  http://host.docker.internal:8080
#   På Azure (sættes på Web App'en):             https://kino-backend-nfs-....azurewebsites.net
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass ${BACKEND_URL};
        # Azure finder den rigtige app ud fra Host-headeren, så den skal være backendens adresse
        proxy_set_header Host $proxy_host;
        # Nødvendig, når backenden kører på https
        proxy_ssl_server_name on;
    }
}
